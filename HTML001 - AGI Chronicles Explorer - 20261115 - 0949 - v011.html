  p.c.forEach(([c,y])=>{const a=(COMP[c]=COMP[c]||[]); if(!a.some(e=>e[0]===p.id&&e[1]===y)) a.push([p.id,y]);});

  p.pr.forEach(r=>{(PRJ[r]=PRJ[r]||[]).push(p.id);});

function wikiURL(t,k){
  let title="";
  if(t==="people"){const w=byId[k].wiki;title=w?w.split("/wiki/")[1]:"";}
  else if(t==="projects") title=(PROJ[k]&&PROJ[k][3])||"";
  else title=WK[k.replace(" ?","")]||"";
  const label=t==="people"?byId[k].n:k.replace(" ?","");
  return title?{u:"https://en.wikipedia.org/wiki/"+title,exact:true}:{u:"https://en.wikipedia.org/w/index.php?search="+encodeURIComponent(label),exact:false};
}
function wikiBtn(t,k){const w=wikiURL(t,k);return `<a class="wiki" href="${w.u}" target="_blank" rel="noopener">${w.exact?"Wikipedia ↗":"Search Wikipedia ↗"}</a>`;}
const refLabel = t=>decodeURIComponent(t).replace(/_/g," ");

/* ---------- images ---------- */
const IMG = (()=>{try{return JSON.parse(STORE.get("agiImg")||"{}");}catch(e){return {};}})();
const pending = {};
function wikiTitle(t,k){
  if(t==="people"){const w=byId[k].wiki;return w?w.split("/wiki/")[1]:"";}
  if(t==="projects")return (PROJ[k]&&PROJ[k][3])||"";
  return "";
}
function imgSrc(t,k){
  if(t==="people"&&byId[k]&&byId[k].img) return byId[k].img;
  if(t==="companies"||t==="schools") return DOM[k]?`https://www.google.com/s2/favicons?domain=${DOM[k]}&sz=256`:"";
  const key=t+"|"+k;
  if(key in IMG) return IMG[key];
  const title=wikiTitle(t,k);
  if(!title){ if(t==="projects"&&PROJ[k]&&DOM[PROJ[k][0]]) return imgSrc("companies",PROJ[k][0]); return ""; }
  if(!pending[key] && typeof fetch==="function"){
    pending[key]=fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+title)
     .then(r=>r.ok?r.json():{}).then(j=>{
       let u=(j.thumbnail&&j.thumbnail.source)||"";
       if(u) u=u.replace(/\/\d+px-/,"/400px-");
       if(!u&&t==="projects"&&DOM[PROJ[k][0]]) u=imgSrc("companies",PROJ[k][0]);
       IMG[key]=u; STORE.set("agiImg",JSON.stringify(IMG));
       Array.from(document.querySelectorAll("[data-img]")).filter(el=>el.dataset.img===key).forEach(el=>fill(el,u));
     }).catch(()=>{});
  }
  return null;
}
const initials = n=>n.replace(/[()\/]/g," ").split(/\s+/).filter(w=>/^[A-Za-z0-9]/.test(w)).map(w=>w[0]).join("").slice(0,2).toUpperCase();
function fill(el,u){ if(u){el.innerHTML=`<img src="${u}" alt="" onerror="this.parentNode.textContent='${el.dataset.ini}'">`;} }
function pic(t,k,cls){
  const label=t==="people"?byId[k].n:k, ini=initials(label), sq=t==="people"?"":" sq";
  const u=imgSrc(t,k);
  const inner=u?`<img src="${u}" alt="" onerror="this.parentNode.textContent='${ini}'">`:ini;
  return `<div class="${cls}${sq}" data-img="${t}|${k.replace(/"/g,"&quot;")}" data-ini="${ini}">${inner}</div>`;
}

function keys(){
  const src = view==="people"?P.map(p=>p.id):Object.keys(view==="companies"?COMP:view==="schools"?SCH:PRJ);
  const name = k=>view==="people"?lastName(byId[k].n):k;
  return src.sort((a,b)=> sortBy==="az" ? name(a).localeCompare(name(b)) : (score(view,b)-score(view,a)) || name(a).localeCompare(name(b)));
}
function renderList(){
  const q=$("q").value.toLowerCase();
  $("list").innerHTML = keys().filter(k=>(view==="people"?byId[k].n:k).toLowerCase().includes(q)).map(k=>{
    const label = view==="people"?`<span class="rank">#${RANK[k]}</span>${esc(byId[k].n)}`:esc(k);
    const cnt = view==="people"?CONN[k].length+" links":ids(view,k).length+" ppl";
    return `<div class="item" onclick="go('${view}','${q_(k)}')">${pic(view,k,"thumb")}<span class="nm">${label}</span><span class="count">${cnt}</span></div>`;
  }).join("");
}
function connHTML(p){
  const list=CONN[p.id].slice().sort((a,b)=>RANK[a.o]-RANK[b.o]);
  if(!list.length) return "<i>None tracked.</i>";
  return list.map(c=>{
    const o=byId[c.o], w=wikiURL("people",c.o);
    const rival=/rival|conflict|opponent|critic|rupture|split/i.test(c.t)?" rival":"";
    const why=esc(c.w).replace(/\(book\)/g,'<span class="tag src">book</span>');
    return `<div class="conn"><div class="top">${pL(c.o)}<span class="ctype${rival}">${esc(c.t)}</span></div>
      <div class="why">${why}</div>
      <div class="refs"><a class="wiki sm" href="${w.u}" target="_blank" rel="noopener">${esc(o.n)} ↗</a>${(c.refs||[]).map(r=>`<a class="wiki sm" href="https://en.wikipedia.org/wiki/${r}" target="_blank" rel="noopener">${esc(refLabel(r))} ↗</a>`).join("")}</div></div>`;

function projectHTML(k){
  const m=PROJ[k]||["—","—",""];
  return `<div class="hero">${pic("projects",k,"photo")}<div><h2>${esc(k)}</h2>${wikiBtn("projects",k)}<p>${esc(m[2])}</p></div></div>
  <table><tr><th>Developed at</th><th>Year</th></tr><tr><td>${COMP[m[0]]?L("companies",m[0],m[0],true):esc(m[0])}</td><td>${m[1]}</td></tr></table>
  <h3>People involved</h3><div class="chips">${PRJ[k].map(pL).join("")||"<i>—</i>"}</div>`;
}
const foot=`<div class="note"><b>Book exposure</b> is an estimated ranking of how prominent each person is in the book; companies, schools and projects are scored by the exposure of their linked people. <b>Confirmed in book coverage</b> = appears in published excerpts, reviews or Roose interviews; <b>Inferred</b> = likely, based on the book's stated topics. Connection notes tagged <span class="tag src">book</span> come from book excerpts/reviews; the rest are general knowledge. Bios, schools, years and projects are general knowledge. <span class="verify">[Verify]</span> marks uncertain facts. Photos load from Wikipedia and logos from site icons (internet required). Draft research aid.</div>`;
function renderDetail(){
  const html=view==="people"?personHTML(byId[sel]):view==="companies"?companyHTML(sel):view==="schools"?schoolHTML(sel):projectHTML(sel);
  $("detail").innerHTML=`<button id="back" onclick="hBack()">&larr; Back</button>`+html+foot;
  document.querySelector("main").classList.add("show-detail");
  $("q").style.display="none"; $("sorts").style.display="none";
  window.scrollTo(0,0);
}
function showList(){
  document.querySelector("main").classList.remove("show-detail");
  $("q").style.display=""; $("sorts").style.display="";
  renderList(); window.scrollTo(0,0);
}
function setTabs(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.v===view));
  document.querySelectorAll(".sorts button[data-s]").forEach(b=>b.classList.toggle("active",b.dataset.s===sortBy));}
function applyState(st){view=st.v||"people";sel=st.k||null;setTabs();if(sel)renderDetail();else showList();}
function go(t,k){view=t;sel=k;hPush({v:t,k:k});setTabs();renderDetail();}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;sel=null;$("q").value="";hPush({v:view});setTabs();showList();});
document.querySelectorAll(".sorts button[data-s]").forEach(b=>b.onclick=()=>{sortBy=b.dataset.s;setTabs();renderList();});
document.querySelectorAll(".sorts button[data-z]").forEach(b=>b.onclick=()=>{zoom=Math.min(60,Math.max(14,zoom+2*b.dataset.z));document.documentElement.style.fontSize=zoom+"px";STORE.set("agiZoom25",zoom);});
$("q").oninput=renderList;
window.onpopstate=e=>{if(NAV.length>1)NAV.pop();applyState(e.state||NAV[NAV.length-1]||{v:"people"});};
NAV.push({v:"people"});if(HIST_OK){try{history.replaceState({v:"people"},"");}catch(e){HIST_OK=false;}}
setTabs(); showList();
</script>
</body>
</html>
